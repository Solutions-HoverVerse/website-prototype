<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }
  .stage-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    min-height: 380px;
    background: #0E141B;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .stage-tag {
    position: absolute;
    bottom: 16px;
    left: 16px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #2DD68C;
    background: rgba(14, 20, 27, 0.85);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(45, 214, 140, 0.3);
    backdrop-filter: blur(8px);
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage-wrap">
  <canvas id="depthCloud"></canvas>
  <span class="stage-tag">Edge-processed depth map &middot; zero cloud</span>
</div>

<script>
(function() {
  "use strict";
  var canvas = document.getElementById("depthCloud");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var w, h, dpr, pts = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth;
    h = canvas.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = [];
    var N = Math.round((w * h) / 1300);
    for (var i = 0; i < N; i++) {
      pts.push({
        x: Math.random() * w,
        y: Math.random() * h,
        z: Math.random(),
        s: Math.random() * Math.PI * 2
      });
    }
  }
  resize();
  window.addEventListener("resize", resize);

  var mx = 0.5, my = 0.5;
  window.addEventListener("pointermove", function(e) {
    var r = canvas.getBoundingClientRect();
    mx = (e.clientX - r.left) / (r.width || 1);
    my = (e.clientY - r.top) / (r.height || 1);
  });

  function frame(t) {
    ctx.clearRect(0, 0, w, h);
    var cx = w * (0.35 + mx * 0.3), cy = h * (0.35 + my * 0.3);
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i];
      p.s += 0.01;
      var dist = Math.hypot(p.x - cx, p.y - cy);
      var near = Math.max(0, 1 - dist / (w * 0.5));
      var a = (0.08 + p.z * 0.3) * (0.5 + near);
      var size = (0.6 + p.z * 1.5) * (0.8 + (0.5 + 0.5 * Math.sin(p.s + p.z * 6)) * 0.6);
      var g = Math.round(150 + near * 80);
      ctx.beginPath();
      ctx.fillStyle = "rgba(45," + (190 + Math.round(near * 30)) + "," + g + "," + a + ")";
      ctx.arc(p.x, p.y + Math.sin(p.s) * 2, size, 0, Math.PI * 2);
      ctx.fill();
    }
    var sy = (Math.sin(t / 1700) * 0.5 + 0.5) * h;
    var grad = ctx.createLinearGradient(0, sy - 44, 0, sy + 44);
    grad.addColorStop(0, "rgba(45,214,140,0)");
    grad.addColorStop(0.5, "rgba(45,214,140,0.12)");
    grad.addColorStop(1, "rgba(45,214,140,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, sy - 44, w, 88);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
